name: PR Artifact Links

# When a Development Build finishes for a branch that has an open PR,
# post (or update) a comment on that PR with direct download links for
# the build artifacts, so test builds are one click away from the PR page.

on:
  workflow_run:
    workflows: ["Development Build"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Comment artifact links on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            // Find the open PR whose head is the branch that was built
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
            });
            if (prs.data.length === 0) {
              core.info(`No open PR for branch ${run.head_branch}; nothing to do`);
              return;
            }
            const pr = prs.data[0];

            // Skip stale runs for commits that are no longer the PR head
            if (pr.head.sha !== run.head_sha) {
              core.info(`Run is for ${run.head_sha} but PR head is ${pr.head.sha}; skipping`);
              return;
            }

            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            if (artifacts.data.artifacts.length === 0) {
              core.info('No artifacts on this run; nothing to do');
              return;
            }

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const lines = artifacts.data.artifacts.map(a =>
              `- [${a.name}](${repoUrl}/actions/runs/${run.id}/artifacts/${a.id}) (${(a.size_in_bytes / 1048576).toFixed(1)} MB)`);

            const marker = '<!-- pr-artifact-links -->';
            const body = [
              marker,
              `### 📦 Test build ready for \`${run.head_sha.substring(0, 7)}\``,
              '',
              ...lines,
              '',
              `[Workflow run](${run.html_url})`,
            ].join('\n');

            // Keep a single up-to-date comment per PR
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
